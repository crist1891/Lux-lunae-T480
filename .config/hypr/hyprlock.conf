background {
    monitor =
    path = ~/.config/lux/walls/Cope_watches_Tewy.png
    blur_passes = 0
}

# Shadow 22 emblem (original image, unmodified)
image {
    monitor =
    path = ~/.config/lux/shadow22-emblem.png
    size = 150
    border_size = 0
    rounding = 0
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(b5313aff)
    font_size = 64
    font_family = Almendra
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = Lux Lunae — Fiat Lux!
    color = rgba(e9e6c8ff)
    font_size = 20
    font_family = Almendra
    position = 0, -10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(988f46ff)
    inner_color = rgba(050403cc)
    font_color = rgba(e9e6c8ff)
    check_color = rgba(bfb771ff)
    fail_color = rgba(b5313aff)
    fade_on_empty = false
    placeholder_text = <i>Fiat lux…</i>
    fail_text = <i>Umbra.</i>
    rounding = 0
    position = 0, -90
    halign = center
    valign = center
}
